[Unit]
Requires=rtl-antenna-picker.service
After=rtl-antenna-picker.service

[Service]
# No ADS-B dongle present (picker degraded mode): skip instead of grabbing the
# dongle PiAware last pointed at, which may now carry another role.
ExecCondition=/bin/sh -c 'grep -q "^ADSB_RTL_INDEX=" /run/rtl-antenna-picker.env'
