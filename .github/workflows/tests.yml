name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest build
      - run: python -m py_compile rtl_antenna_picker.py
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: rtl-antenna-picker --help
      - run: rtl-antenna-picker-install-piaware-ais-systemd --help
      - name: verify packaged systemd data
        run: |
          cd /tmp
          python - <<'PY'
          import rtl_antenna_picker
          root = rtl_antenna_picker.find_systemd_template_root()
          assert (root / "rtl-antenna-picker.service").exists(), root
          print(root)
          PY
